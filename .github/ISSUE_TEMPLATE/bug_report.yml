name: Incorrect finding or workflow failure
description: Report a minimal reproducible design check or onboarding problem.
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Usual Design. Search existing issues first.
        Keep security vulnerabilities out of public issues; follow SECURITY.md instead.
        Review source snippets, manifest values, paths, and output for private information.
        Never include credentials or the local wizard's session URL/token.
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - Analysis or diagnostics
        - Manifest or discovery
        - Wizard or onboarding
        - Repair records or activation
        - Agent setup or hooks
        - Installation or packaging
        - Website or documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include CLI version or source revision, Node/npm/Tailwind versions, and OS. For integrations, include shell and agent/client versions.
      placeholder: |
        Usual Design version / revision:
        Node / npm:
        Tailwind:
        OS / shell:
        Agent / client (if relevant):
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small sanitized source example and manifest, including active categories and include/ignore paths. List exact steps and the working directory, or link a public minimal reproduction you are allowed to share. For UI/docs issues, identify the page and steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should happen under the declared contract.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact command, exit status, and sanitized output. For UI issues, describe the observed behavior; a sanitized screenshot can help.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the report and attachments for credentials, private source, personal information, and session tokens.
          required: true
        - label: This is a public bug report, not a private security or conduct report.
          required: true

name: Feature or documentation proposal
description: Propose an improvement with a concrete use case and intended behavior.
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem you need to solve. Search existing proposals and read
        docs/compatibility.md before suggesting a broader analysis boundary.
        Small documentation corrections can go straight to a pull request.
        Keep private source and security details out of this public form.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe who encounters it and a concrete example of the current limitation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Show the user-visible result. For analysis support, include a small source/manifest example, what should pass or fail, and any case that should remain unknown.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What have you tried? Explain why existing supported patterns or documented workflows do not cover the need.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and tradeoffs
      description: Mention relevant frameworks/versions, policy or schema changes, dependencies, performance, or migration concerns if known.
